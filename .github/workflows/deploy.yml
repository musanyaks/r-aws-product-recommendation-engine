on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsodium-dev libssl-dev libxml2-dev
      - uses: r-lib/actions/setup-renv@v2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4

      - name: Start floci
        run: |
          docker run -d --name floci -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            floci/floci:latest
          for i in $(seq 1 30); do
            curl -fs http://localhost:4566 >/dev/null && exit 0
            sleep 1
          done
          echo "floci did not start" && docker logs floci && exit 1

      - name: Provision floci resources
        run: bash aws/local/init.sh

      - name: Verify resources
        run: |
          aws s3 ls | grep reco-engine-local
          aws secretsmanager list-secrets --query "SecretList[].Name"

      - name: Build API image
        run: docker build -t reco-api:${{ github.sha }} .
